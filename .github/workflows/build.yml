
#输入的机型名称要注意与configs/templates/目录下的名字相同

name: Build Padavan

on: 
  workflow_dispatch:
    inputs:
      version:
        description: '请输入编译机型，例如K2P'
        required: true

env:                      # 环境变量
  MHZ: 1100               # MT7621 CPU超频频率设置 必须为20的倍数。开启超频请打开对应选项开关

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
              sudo apt update
              sudo apt install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd \
              fakeroot kmod cpio git python3-docutils gettext automake autopoint \
              texinfo build-essential help2man pkg-config zlib1g-dev libgmp3-dev \
              libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget libc-dev-bin

      - name: Build Firmware
        env:
          Model: ${{ github.event.inputs.version }}
        run: |
              git clone https://github.com/cxhacker1/rt-n56u.git /opt/rt-n56u
              cd /opt/rt-n56u/toolchain-mipsel
              ./clean_toolchain
              ./build_toolchain
              mkdir -p /opt/images/
              cd /opt/rt-n56u/trunk

              echo "CPU超频到$MHZ"mhz
              echo "修改CPU频率"
              clock=`echo "obase=16 ; ibase=10 ; (((($MHZ/20)-1)*16+2))" | bc`
              echo "16进制$clock"
              sed -i "554,555s:0xff:0x7ff:g" /opt/rt-n56u/trunk/linux-3.4.x/arch/mips/rt2880/init.c
              sed -i "554,556s:0xc2:0x$clock:g" /opt/rt-n56u/trunk/linux-3.4.x/arch/mips/rt2880/init.c

              sudo ./build_firmware_modify $Model
              sudo mv -f images/*.trx /opt/images/
      
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-packages
          path: /opt/images